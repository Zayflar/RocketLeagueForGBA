<!DOCTYPE html>
<html>
<body>
<h1>Processing WEBP to GBA Header...</h1>
<img id="img" src="menu.webp" style="display:none;" onload="process()">
<textarea id="output" style="width:100%; height: 500px;"></textarea>
<script>
function process() {
    let img = document.getElementById('img');
    let canvas = document.createElement('canvas');
    canvas.width = 240;
    canvas.height = 160;
    let ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 240, 160);
    let data = ctx.getImageData(0, 0, 240, 160).data;
    
    // GBA Base Palette matching the engine
    let base_colors = [
        [31, 31, 31], [31, 0, 0], [0, 31, 0], [0, 10, 31],
        [31, 31, 0], [0, 31, 31], [31, 16, 0], [25, 0, 25]
    ];
    let palette = [];
    
    for (let c = 0; c < 8; c++) {
        for (let s = 0; s < 16; s++) {
            let r = Math.floor((base_colors[c][0] * s) / 15);
            let g = Math.floor((base_colors[c][1] * s) / 15);
            let b = Math.floor((base_colors[c][2] * s) / 15);
            palette.push({r: Math.floor(r * 255 / 31), g: Math.floor(g * 255 / 31), b: Math.floor(b * 255 / 31)});
        }
    }
    
    // System colors (128-137)
    let sys_colors = [
        [1, 1, 5], [0, 31, 16], [31, 31, 31], [31, 24, 0],
        [0, 0, 0], [0, 26, 12], [4, 22, 4], [6, 28, 6],
        [8, 18, 2], [31, 31, 0]
    ];
    for (let i = 0; i < sys_colors.length; i++) {
        palette.push({
            r: Math.floor(sys_colors[i][0] * 255 / 31),
            g: Math.floor(sys_colors[i][1] * 255 / 31),
            b: Math.floor(sys_colors[i][2] * 255 / 31)
        });
    }
    
    while (palette.length < 256) {
        palette.push({r: 0, g: 0, b: 0});
    }
    
    // Use floyd-steinberg dithering or just closest match
    let out_indices = new Array(38400);
    
    // Flatten RGB
    let fR = new Float32Array(38400);
    let fG = new Float32Array(38400);
    let fB = new Float32Array(38400);
    for(let i=0; i<38400; i++) {
        fR[i] = data[i*4];
        fG[i] = data[i*4+1];
        fB[i] = data[i*4+2];
    }
    
    for (let y = 0; y < 160; y++) {
        for (let x = 0; x < 240; x++) {
            let i = y * 240 + x;
            let r = fR[i], g = fG[i], b = fB[i];
            
            let best_idx = 0;
            let best_dist = Infinity;
            for(let p=0; p < palette.length; p++) {
                let dr = r - palette[p].r;
                let dg = g - palette[p].g;
                let db = b - palette[p].b;
                let dist = dr*dr + dg*dg + db*db;
                if(dist < best_dist) {
                    best_dist = dist;
                    best_idx = p;
                }
            }
            
            out_indices[i] = best_idx;
            let errR = r - palette[best_idx].r;
            let errG = g - palette[best_idx].g;
            let errB = b - palette[best_idx].b;
            
            function distribute(dx, dy, factor) {
                let nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < 240 && ny < 160) {
                    let ni = ny * 240 + nx;
                    fR[ni] += errR * factor;
                    fG[ni] += errG * factor;
                    fB[ni] += errB * factor;
                }
            }
            
            distribute(1, 0, 7/16);
            distribute(-1, 1, 3/16);
            distribute(0, 1, 5/16);
            distribute(1, 1, 1/16);
        }
    }
    
    let out = "#ifndef MENU_ART_H\\n#define MENU_ART_H\\n\\n#include <tonc.h>\\n\\n";
    out += "const u8 menu_art_data[38400] __attribute__((aligned(4))) = {\\n";
    for(let i=0; i<38400; i++) {
        out += "0x" + out_indices[i].toString(16).padStart(2, '0') + ",";
        if ((i+1) % 16 === 0) out += "\\n";
    }
    out += "};\\n\\n#endif // MENU_ART_H\\n";
    
    document.getElementById('output').value = out;
    document.title = "DONE";
}
</script>
</body>
</html>
